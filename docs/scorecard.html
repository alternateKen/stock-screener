<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brief scorecard · Stock Screener</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
<style>
.filters{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px}
.filters .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.filters .lbl{color:var(--mute);margin-right:2px}
td.cell{line-height:1.25}
td.cell b{font-weight:600;display:block}
td.cell small{color:var(--mute);font-size:11px}
td.cell .blk{display:block}
td.why{white-space:normal;text-align:left;font-size:12px;min-width:180px}
tr.grp td{background:var(--bg);font-size:11px;color:var(--mute);text-transform:none}
.pend{color:var(--mute);font-size:11px}
table.trk td.hz{text-align:right;line-height:1.3;white-space:nowrap;vertical-align:top}
table.trk td.hz b{display:block;font-size:15px;font-weight:600}
table.trk .hl{display:block;font-size:11px;color:var(--mute)}
table.trk .hl i{font-style:normal;font-weight:600;color:var(--ink)}
table.trk .hl em{font-style:normal}
table.trk td.nm{vertical-align:top;min-width:200px}
table.trk td.nm small{display:block;color:var(--mute);font-size:11px;white-space:normal}
table.trk td.nm small.why{max-width:340px}
#positions th small,table.trk tr.lhead td{background:var(--bg);padding:16px 12px 8px;border-bottom:2px solid var(--line)}
table.trk tr.lhead .lt{font-size:17px;font-weight:700;letter-spacing:.1px}
table.trk tr.lhead .lt.up{color:var(--up)}table.trk tr.lhead .lt.dn{color:var(--dn)}
table.trk tr.lhead .mu{font-size:12px;margin-left:6px}
table.trk tr.pick td{background:color-mix(in srgb,var(--acc) 7%,transparent)}
table.trk tr.pick td.nm{box-shadow:inset 3px 0 0 var(--acc)}
table.trk tr.ext td{opacity:.62}
table.trk th.sortable{cursor:pointer}table.trk th.sortable.on{color:var(--acc)}
table.trk td.nm a.stk{font-size:15px;font-weight:600}
.tag.pick{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag.ext{color:var(--mute)}
table.trk th small{display:block;font-weight:400;color:var(--mute);font-size:10px}
.tag{font-size:10px;padding:1px 6px;border-radius:9px;border:1px solid currentColor;vertical-align:1px}
#bsel{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:12px}
#q{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:12px;min-width:170px}
details.stats{margin:14px 0}
details.stats>summary{cursor:pointer;font-weight:600;padding:10px 20px;color:var(--acc)}
</style>
</head>
<body>
<main id="main"></main>
<script src="common.js"></script>
<script>
// Scorecard of the morning briefs (scorecard.json, written by scripts/track_briefs.py evaluate).
header('Brief scorecard','<a href="brief.html">&larr; Today\'s brief</a> &nbsp;·&nbsp; ');
let S=null;
const F={entry:'close',measure:'dir',brief:'all',health:'all',h:'1W',list:'all'};
const MEASURES={dir:'Return (shorts flipped)',x_spx:'vs S&P 500',x_loc:'vs home index',x_univ:'vs all theme stocks',adr_units:'In ADRs'};
const unit=m=>m==='adr_units'?' ADR':'%';
const fmtv=(v,m)=>v==null?'–':(v>0?'+':'')+v.toFixed(m==='adr_units'?2:1)+unit(m);
function rowsF(){return S.rows.filter(r=>(F.brief==='all'||r.brief===F.brief)&&(F.health==='all'||r.health===F.health))}
const cubeOf=(l,h)=>{const c=S.cube[`${l}|${h}|${F.entry}|${F.health}|${F.measure}`];return c?{n:c.n,hit:c.hit,mean:c.mean,med:c.med,pend:c.pend,due:c.due,miss:c.miss}:{n:0,pend:0}};
function stat(rows,h){
  const v=[],pend=[];let miss=0;
  for(const r of rows){
    if(r.status!=='ok'){miss++;continue}
    const x=(r.res||{})[h]||{};
    if(x.pending){pend.push(x.due);continue}
    const y=(x[F.entry]||{})[F.measure];
    if(y!=null)v.push(y);
  }
  const mean=v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
  const s=v.slice().sort((a,b)=>a-b),med=s.length?(s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2):null;
  return {n:v.length,hit:v.length?Math.round(100*v.filter(x=>x>0).length/v.length):null,mean,med,pend:pend.length,due:pend.sort()[0],miss};
}
const hitCls=h=>h==null?'':h>=55?'up':h<=45?'dn':'mu';
function summaryHTML(){
  const rows=rowsF(),lists=[...new Set(Object.keys(S.cube).map(k=>k.split('|')[0]))],all=F.brief==='all';
  const groups=[['Long setups',['breakouts','pullbacks','near_breakout','all_long']],['Short setups',['breakdowns','bounces','near_breakdown','all_short']],
    ['Split by signal and rule path',['breakouts_level','breakouts_hi52','breakouts_ma','pullbacks_band','pullbacks_touch','breakdowns_level','breakdowns_lo52','breakdowns_ma','bounces_band','bounces_touch']],
    ['Improving / deteriorating',['improving','deteriorating']],['High-ADR leaders',['leaders_lead','leaders_lag']],
    ['Curated in the Notion brief',['pick_best_long','pick_clean_long','pick_extended','pick_best_short','pick_clean_short']]];
  const label=l=>S.labels[l]||l;
  const body=groups.map(([g,ls])=>{
    const present=ls.filter(l=>lists.includes(l));if(!present.length)return '';
    return `<tr class="grp"><td colspan="${S.horizons.length+1}">${esc(g)}</td></tr>`+present.map(l=>{
      const rs=rows.filter(r=>r.list===l);
      return `<tr><td class="nm">${esc(label(l))}<small>${all?'all briefs':'brief '+esc(F.brief)}</small></td>`+S.horizons.map(h=>{
        const s=all?cubeOf(l,h):stat(rs,h);
        if(!s.n)return `<td class="cell"><span class="pend">${s.pend?`${s.pend} pending<br>first due ${esc(s.due||'')}`:'–'}</span></td>`;
        return `<td class="cell"><b class="${hitCls(s.hit)}">${s.hit}% right</b><span class="${cls(s.mean)}">${fmtv(s.mean,F.measure)}</span> <small>avg · med ${fmtv(s.med,F.measure)} · n ${s.n}${s.pend?` · ${s.pend} pending`:''}</small></td>`}).join('')+'</tr>'}).join('')}).join('');
  return `<section id="summary"><h2>Hit rate and average result by setup list</h2>
   <div class="scroll"><table><tr><th style="text-align:left">List</th>${S.horizons.map(h=>`<th>${h}</th>`).join('')}</tr>${body}</table></div>
   <div class="note">"Right" means the measure below is above zero: a long went up, a short went down${F.measure!=='dir'?`, after taking off the ${F.measure==='x_spx'?'S&amp;P 500':F.measure==='x_loc'?'home-market index':F.measure==='x_univ'?'equal-weight basket of all theme stocks':''}`:''}.
   Entry: ${F.entry==='close'?'close of the bar the brief was computed from':'next session\'s open, the first price you could trade after reading the brief'}. 1W = 5 sessions, 20D = 20 sessions, in each stock's own market sessions. Green at 55%+ right, red at 45% or less. Small samples mislead: wait for n of 30+ before changing a rule.</div></section>`;
}
function mechanicsHTML(){
  const rows=rowsF(),h=F.h,lists=Object.keys(S.labels);
  const pct=(a)=>a.length?Math.round(100*a.filter(Boolean).length/a.length)+'%':'–';
  const pv=v=>v==null?'–':v+'%';
  const body=lists.map(l=>{
    if(F.brief==='all'){const m=S.mech[`${l}|${h}|${F.entry}|${F.health}`];if(!m||!m.n)return '';
      return `<tr><td class="nm">${esc(S.labels[l])}</td><td>${m.n}</td><td>${m.payoff==null?'–':m.payoff.toFixed(2)}</td><td class="up">${pc(m.mfe)}</td><td class="dn">${pc(m.mae)}</td><td>${pv(m.triggered)}</td><td>${pv(m.target_hit)}</td><td>${pv(m.level_held)}</td><td>${pv(m.tier_held)}</td></tr>`}
    const rs=rows.filter(r=>r.list===l&&r.status==='ok'&&r.res[h]&&!r.res[h].pending);
    if(!rs.length)return '';
    const g=k=>rs.map(r=>r.res[h][k]).filter(x=>x!=null),m=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
    const d=rs.map(r=>(r.res[h][F.entry]||{}).dir).filter(x=>x!=null),w=d.filter(x=>x>0),lo=d.filter(x=>x<0);
    const payoff=w.length&&lo.length?(m(w)/-m(lo)).toFixed(2):'–';
    return `<tr><td class="nm">${esc(rs[0].label)}</td><td>${rs.length}</td><td>${payoff}</td><td class="up">${pc(m(g('mfe')))}</td><td class="dn">${pc(m(g('mae')))}</td>
      <td>${pct(g('triggered'))}</td><td>${pct(g('target_hit'))}</td><td>${pct(g('level_held'))}</td><td>${pct(g('tier_held'))}</td></tr>`}).join('');
  return `<section id="mechanics"><h2>Setup mechanics at ${esc(h)}</h2><div class="scroll"><table><tr><th style="text-align:left">List</th><th>n</th><th>Payoff (avg win / avg loss)</th><th>Avg best move</th><th>Avg worst move</th><th>Pattern triggered</th><th>Target reached</th><th>Broken level held</th><th>Tier held</th></tr>${body||'<tr><td colspan="9" class="mu">No completed results at this horizon yet.</td></tr>'}</table></div>
   <div class="note">Best / worst move: the most favourable and most adverse intraday excursion from the signal close (shorts flipped). Pattern triggered: a close 1% through the breakout / breakdown level (the screener's own confirmation rule). Target: the pattern's measured target touched intraday. Broken level held: no close back through the support / resistance a breakout or breakdown cleared. Tier held: the stock is still in the tier it was listed in.</div></section>`;
}
function healthHTML(){
  if(!S.health.length)return '';
  const body=S.health.slice().reverse().map(x=>`<tr><td class="nm">${esc(x.brief)}</td><td class="${x.status==='Healthy'?'up':x.status==='Risk-off'?'dn':'mu'}">${esc(x.status||'–')}</td>`+
    S.horizons.map(h=>{const y=x[h]||{};return y.spx==null&&y.lead_ew==null?'<td class="pend">pending</td>':`<td class="cell"><span class="blk ${cls(y.spx)}">S&amp;P ${pc(y.spx)}</span><small class="blk">Lead ${pc(y.lead_ew)} · Lagging ${pc(y.lag_ew)}${y.univ_ew!=null?` · all ${pc(y.univ_ew)}`:''}</small></td>`}).join('')+'</tr>').join('');
  return `<section id="health"><h2>Market-health call: what happened next</h2><div class="scroll"><table><tr><th style="text-align:left">Brief</th><th>Call</th>${S.horizons.map(h=>`<th>${h}</th>`).join('')}</tr>${body}</table></div>
   <div class="note">The call is right if Risk-off days are followed by weaker S&amp;P and leader returns than Healthy days, and if Lead-tier leaders beat Lagging ones. Use the Health filter above to compare every list's results by the call made that morning.</div></section>`;
}
function themesHTML(){
  if(!S.themes.length)return `<section id="themes"><h2>Theme calls</h2><div class="empty">Theme results need the screener's data.json (they are computed in the GitHub build).</div></section>`;
  const t=F.brief==='all'?S.themes[S.themes.length-1]:S.themes.find(x=>x.brief===F.brief)||S.themes[S.themes.length-1];
  const rho=(k)=>{const v=S.themes.map(x=>x[k]).filter(x=>x!=null);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)+` <small class="mu">(${v.length})</small>`:'–'};
  const avgRow=`<tr><td class="nm">Rank correlation, 1M momentum vs next return<small>average over briefs (n)</small></td>${S.horizons.map(h=>`<td>${rho('rho_m1_'+h)}</td>`).join('')}</tr>
    <tr><td class="nm">Rank correlation, 5-day tier shift vs next return<small>(Lead change − Lagging change)</small></td>${S.horizons.map(h=>`<td>${rho('rho_tier_'+h)}</td>`).join('')}</tr>`;
  const rows=t.themes.map(x=>`<tr><td class="nm">${esc(x.theme)}<small>1M ${pc(x.m1)} · tier shift ${x.net_tier_5d==null?'–':(x.net_tier_5d>0?'+':'')+x.net_tier_5d}</small></td>${S.horizons.map(h=>`<td class="${cls(x['fwd_'+h])}">${x['fwd_'+h]==null?'<span class="pend">pending</span>':pc(x['fwd_'+h])}</td>`).join('')}</tr>`).join('');
  return `<section id="themes"><h2>Theme calls</h2><div class="scroll"><table><tr><th style="text-align:left"></th>${S.horizons.map(h=>`<th>${h}</th>`).join('')}</tr>${avgRow}</table></div>
   <h3>Brief ${esc(t.brief)}: each theme's equal-weight return afterwards</h3><div class="scroll"><table><tr><th style="text-align:left">Theme (as ranked that day)</th>${S.horizons.map(h=>`<th>${h}</th>`).join('')}</tr>${rows}</table></div>
   <div class="note">+1 means the brief's theme ranking was exactly the order of what came next; 0 means no relationship. Momentum calls are working when this sits persistently above about +0.2.</div></section>`;
}
// ---- the main view: one brief, every setup, return plus high / low in each window ----
const T={brief:null,side:'all',q:'',sort:'rank'};
// pick rank: the brief's own Best and Cleanest calls first, names it flagged as extended last
const PICK_RANK={'Best long':0,'Best short':0,'Cleanest':1,'Extended: do not chase':3};
const pickRank=tags=>tags&&tags.length?Math.min(...tags.map(t=>PICK_RANK[t]??2)):2;
const MAIN=[['breakouts','pullbacks','near_breakout'],['breakdowns','bounces','near_breakdown'],['improving'],['deteriorating'],['leaders_lead','leaders_lag']].flat();
const PICK_TAG={pick_best_long:'Best long',pick_best_short:'Best short',pick_clean_long:'Cleanest',pick_clean_short:'Cleanest',pick_extended:'Extended: do not chase'};
const dp=v=>v==null?2:Math.abs(v)>=1000?0:Math.abs(v)>=100?1:2;
const px=v=>v==null?'–':fmt(v,dp(v));
// the selected brief (morning or a midday edition) and its windows: a midday edition adds the rest of that day first
const BI=id=>(S.briefs||[]).find(x=>(x.id||x.session)===id)||{};
const midday=()=>(BI(T.brief).edition||'morning')!=='morning';
const HZ=()=>midday()&&S.intraday_horizon?[S.intraday_horizon,...S.horizons]:S.horizons;
const hzName=h=>h===S.intraday_horizon?'Rest of day':h;
function hzCell(r,h){
  const x=(r.res||{})[h];
  if(r.status!=='ok')return `<td class="hz pend">${esc(r.status)}</td>`;
  if(!x)return '<td class="hz">–</td>';
  if(x.pending)return `<td class="hz pend">due ${esc(x.due)}</td>`;
  const c=x.close||{},good=v=>v==null?'':(v*r.side>0?'up':v*r.side<0?'dn':'');
  if(h===S.intraday_horizon)return `<td class="hz"><b class="${good(c.ret)}">${pc(c.ret)}</b><span class="hl">close ${px(x.px)}</span></td>`;
  return `<td class="hz"><b class="${good(c.ret)}">${pc(c.ret)}</b>
    <span class="hl"><i>H</i> ${px(x.hi)} <em class="${good(x.hi_pct)}">${pc(x.hi_pct)}</em></span>
    <span class="hl"><i>L</i> ${px(x.lo)} <em class="${good(x.lo_pct)}">${pc(x.lo_pct)}</em></span></td>`;
}
function glance(rows){
  const side=sd=>{const rs=rows.filter(r=>r.list===(sd>0?'all_long':'all_short'));
    return HZ().map(h=>{const v=rs.map(r=>((r.res[h]||{}).close||{}).dir).filter(x=>x!=null),p=rs.filter(r=>(r.res[h]||{}).pending);
      if(!v.length)return `<div class="row"><span>${hzName(h)}</span><b class="mu">${p.length?`${p.length} due ${esc(p.map(r=>r.res[h].due).sort()[0])}`:'–'}</b></div>`;
      const m=v.reduce((a,b)=>a+b,0)/v.length,hit=Math.round(100*v.filter(x=>x>0).length/v.length);
      return `<div class="row"><span>${hzName(h)}</span><b><span class="${cls(m)}">${pc(m)}</span> · ${hit}% right <small class="mu">(${v.length}${p.length?`, ${p.length} to come`:''})</small></b></div>`}).join('')};
  const b=BI(T.brief);
  return `<div class="cards">
    <div class="card"><div class="nm">Long setups: average move</div>${side(1)}</div>
    <div class="card"><div class="nm">Short setups: average move <small class="mu">(a fall counts as a gain)</small></div>${side(-1)}</div>
    <div class="card"><div class="nm">Leaders' health call${midday()?' at that build':' that morning'}</div><div class="big ${b.status==='Healthy'?'up':b.status==='Risk-off'?'dn':''}" style="font-size:18px">${esc(b.status||'–')}</div>
      <div class="row"><span>${midday()?'Edition':'US session'}</span><b>${esc(midday()?b.label:b.session||T.brief)}</b></div><div class="row"><span>Scored</span><b>${esc(S.generated.slice(0,16).replace('T',' '))} UTC</b></div></div></div>`;
}
function trackerHTML(){
  const briefs=S.rows_briefs.slice().reverse();   // newest first: mornings and midday editions in publishing order
  if(!T.brief||!briefs.includes(T.brief))T.brief=briefs[0];
  const all=S.rows.filter(r=>r.brief===T.brief);
  const picks={};all.filter(r=>r.list.startsWith('pick_')).forEach(r=>(picks[r.sym]=picks[r.sym]||[]).push(PICK_TAG[r.list]));
  const q=T.q.trim().toUpperCase();
  const sideOk=r=>T.side==='all'?true:T.side==='picks'?pickRank(picks[r.sym])<2:(T.side==='long')===(r.side>0);
  const keep=r=>sideOk(r)&&(!q||r.sym.toUpperCase().includes(q)||(r.name||'').toUpperCase().includes(q));
  const dirOf=(r,h)=>{const x=(r.res||{})[h];return x&&!x.pending&&x.close?x.close.dir:null};
  const order=rs=>{const idx=new Map(rs.map((r,i)=>[r,i]));const by=T.sort;
    return rs.slice().sort((a,b)=>{
      if(by==='clean'){const d=pickRank(picks[a.sym])-pickRank(picks[b.sym]);if(d)return d}
      else if(by!=='rank'){const x=dirOf(a,by),y=dirOf(b,by);if(x==null&&y!=null)return 1;if(y==null&&x!=null)return -1;if(x!=null&&y!=null&&x!==y)return y-x}
      return idx.get(a)-idx.get(b)})};
  if(T.sort===S.intraday_horizon&&!midday())T.sort='rank';
  const head=`<tr><th style="text-align:left">Stock</th><th>Entry<small>${midday()?'price at the update':'signal close'}</small></th>${HZ().map(h=>`<th class="sortable ${T.sort===h?'on':''}" data-sort="${h}" title="Sort by ${hzName(h)}: best for the trade first">${hzName(h)}${T.sort===h?' ▼':''}<small>${h===S.intraday_horizon?'update to close':'close · high · low'}</small></th>`).join('')}</tr>`;
  const body=MAIN.map(l=>{
    const rs=order(all.filter(r=>r.list===l&&keep(r)));if(!rs.length)return '';
    return `<tr class="lhead"><td colspan="${HZ().length+2}"><span class="lt ${l.startsWith('break')||l==='near_breakdown'||l==='bounces'||l==='deteriorating'||l==='leaders_lag'?'dn':'up'}">${esc(S.labels[l]||l)}</span> <span class="mu">${rs.length} stock${rs.length>1?'s':''}</span></td></tr>`+rs.map(r=>
      `<tr class="${pickRank(picks[r.sym])<2?'pick':pickRank(picks[r.sym])===3?'ext':''}"><td class="nm"><a class="stk" href="${chartUrl(r.k)}">${esc(r.sym)}</a> <span class="tag ${r.side>0?'up':'dn'}">${r.side>0?'long':'short'}</span>${(picks[r.sym]||[]).map(t=>` <span class="tag ${PICK_RANK[t]===3?'ext':'pick'}">${PICK_RANK[t]===3?'':'★ '}${esc(t)}</span>`).join('')}
        <small>${esc(r.name||'')}</small><small class="why">${esc(r.why||'')}</small>${r.flag?`<small class="warn">⚠ ${esc(r.flag)}</small>`:''}</td>
        <td class="hz"><b>${px(r.entry_close)}</b><span class="hl">${esc(r.cur||'')} · ${esc(r.signal_day||'')}</span></td>${HZ().map(h=>hzCell(r,h)).join('')}</tr>`).join('')}).join('');
  const chip=(k,v,l)=>`<span class="fchip ${T[k]===v?'on':''}" data-t="${k}" data-v="${esc(v)}">${esc(l)}</span>`;
  return `<section id="tracker"><h2>Setups from ${esc(BI(T.brief).label||'the brief of '+T.brief)}</h2>
   <div class="filters" style="margin-bottom:10px"><div class="grp"><label class="lbl" for="bsel">Brief</label><select id="bsel">${briefs.map(b=>`<option value="${esc(b)}"${b===T.brief?' selected':''}>${esc(BI(b).label||b)}</option>`).join('')}</select></div>
     <div class="grp"><span class="lbl">Show</span>${chip('side','all','All')}${chip('side','long','Longs')}${chip('side','short','Shorts')}${chip('side','picks','★ Cleanest picks')}</div>
     <div class="grp"><span class="lbl">Sort</span>${chip('sort','rank','Brief order')}${chip('sort','clean','Cleanest first')}${HZ().map(h=>chip('sort',h,hzName(h))).join('')}</div>
     <input id="q" type="search" placeholder="Find a ticker or name" value="${esc(T.q)}"></div>
   ${glance(all)}
   <div class="scroll" style="margin-top:12px"><table class="trk">${head}${body||`<tr><td colspan="${HZ().length+2}" class="mu">No setups match.</td></tr>`}</table></div>
   <div class="note">Windows are counted in the stock's own trading sessions after the brief's signal bar: 1D = next session, 1W = 5 sessions, 20D = 20 sessions.
   Midday editions (Asia: non-US stocks at the first build from 12:00; US: US stocks 1 hour after the open) are measured from the price at that build, with Rest of day (that build to the day's close) first; the statistics and positions below use the morning brief only.
   Brief order is the screener's own ranking: breakouts, pullbacks and Improving by 3-month strength against the S&amp;P 500 (strongest first), breakdowns, bounces and Deteriorating by the same measure weakest first, near breakout / breakdown by the distance to the level (nearest first), leaders as listed. Sorting by 1D, 1W or 20D puts the best result for the trade first (the biggest rise for a long, the biggest fall for a short); stocks still waiting go last.
   ★ marks the brief's own Best and Cleanest calls from Notion; rows the brief flagged as extended are dimmed.
   The large number is the close-to-close change from the entry price. H and L are the highest and lowest prices traded during that window, with the % from the entry.
   Green means the move was in the trade's favour (up for a long, down for a short). <a href="scorecard.csv" style="color:var(--acc)">Download every result as CSV</a> for Excel.</div></section>`;
}
// ---- positions: each stock followed from its first appearance until the brief reverses it or 20 sessions pass ----
const PS={view:'open'};
function positionsHTML(){
  const P=S.positions||[];if(!P.length)return '';
  const R=S.pos_rules||{max:20,whipsaw:5},sm=S.pos_summary||{};
  const sumRow=k=>{const x=sm[k];if(!x||!(x.open+x.closed))return '';
    return `<tr><td class="nm">${esc(S.labels[k]||k)}</td><td>${x.open}</td><td>${x.closed}</td><td class="${cls(x.mean)}">${pc(x.mean)}</td><td>${x.hit==null?'–':x.hit+'%'}</td><td>${x.held==null?'–':x.held.toFixed(1)}</td><td>${x.flip==null?'–':x.flip+'%'}</td><td>${x.whipsaw==null?'–':x.whipsaw+'%'}</td><td>${pc(x.giveback)}</td></tr>`};
  const good=(v,side)=>v==null?'':(v*side>0?'up':v*side<0?'dn':'');
  const rows=P.filter(p=>p.status===PS.view).slice(0,PS.view==='open'?400:150);
  const body=rows.map(p=>`<tr><td class="nm"><a class="stk" href="${chartUrl(p.k)}">${esc(p.sym)}</a> <span class="tag ${p.side>0?'up':'dn'}">${p.side>0?'long':'short'}</span>${p.whipsaw?' <span class="tag dn">whipsaw</span>':''}
      <small>${esc(p.name||'')}</small><small>Opened from ${esc(S.labels[p.list]||p.list)}${p.repeats?` · repeated in ${p.repeats} later brief${p.repeats>1?'s':''}`:''}${p.src==='bbg'?' · Bloomberg':''}</small></td>
    <td class="hz"><b>${px(p.entry)}</b><span class="hl">${esc(p.cur||'')} · ${esc(p.entry_day)}</span></td>
    <td class="hz">${p.held}<span class="hl">sessions</span></td>
    <td class="hz"><b class="${good(p.ret,p.side)}">${pc(p.ret)}</b><span class="hl">${px(p.px)} · ${esc(p.status==='open'?p.last_day:p.exit_day)}</span></td>
    <td class="hz">${px(p.hi)}<span class="hl ${good(p.hi_pct,p.side)}">${pc(p.hi_pct)}</span></td>
    <td class="hz">${px(p.lo)}<span class="hl ${good(p.lo_pct,p.side)}">${pc(p.lo_pct)}</span></td>
    <td class="hz">${p.best_dir==null?'–':pc(p.best_dir)}<span class="hl">gave back ${p.giveback==null?'–':p.giveback.toFixed(1)+' pts'}</span></td>
    ${PS.view==='closed'?`<td class="hz">${esc(p.reason)}<span class="hl">${esc(p.exit_day)}</span></td>`:''}</tr>`).join('');
  const chip=(v,l,n)=>`<span class="fchip ${PS.view===v?'on':''}" data-ps="${v}">${l} (${n})</span>`;
  return `<section id="positions"><h2>Positions: each stock until the brief reverses it</h2>
   <div class="scroll"><table><tr><th style="text-align:left">Opened from</th><th>Open</th><th>Closed</th><th>Avg result<small>closed, shorts flipped</small></th><th>Right</th><th>Avg held<small>sessions</small></th><th>Closed by a flip</th><th>Whipsaw<small>flip within ${R.whipsaw}</small></th><th>Avg giveback<small>best close to exit</small></th></tr>
   ${['breakouts','pullbacks','near_breakout','all_long','breakdowns','bounces','near_breakdown','all_short'].map(sumRow).join('')}</table></div>
   <div class="filters" style="margin:12px 0 8px">${chip('open','Open',P.filter(p=>p.status==='open').length)}${chip('closed','Closed',P.filter(p=>p.status==='closed').length)}</div>
   <div class="scroll"><table class="trk"><tr><th style="text-align:left">Stock</th><th>Entry</th><th>Held</th><th>${PS.view==='open'?'Now':'At exit'}</th><th>High</th><th>Low</th><th>Best close</th>${PS.view==='closed'?'<th>Closed by</th>':''}</tr>${body||'<tr><td colspan="8" class="mu">None yet.</td></tr>'}</table></div>
   <div class="note">A position opens the first time a stock appears in a long or short setup list and stays open while later briefs repeat that direction.
   It closes when a brief lists the stock on the other side (a flip, at that brief's signal close, and a new position opens there) or after ${R.max} sessions.
   High and low are the highest and lowest prices traded while it was open. Giveback is how far the exit was from the best close, in percentage points.
   This does not cut short the setup results above: every appearance keeps its own 1D, 1W and 20D windows. <a href="positions.csv" style="color:var(--acc)">Download positions as CSV</a>.</div></section>`;
}
function filtersHTML(){
  const chip=(k,v,l)=>`<span class="fchip ${F[k]===v?'on':''}" data-f="${k}" data-v="${esc(v)}">${esc(l)}</span>`;
  const briefs=S.rows_briefs.filter(b=>(BI(b).edition||'morning')==='morning'),hs=[...new Set(S.briefs.map(b=>b.status).filter(Boolean))];
  return `<section id="filters"><div class="filters">
    <div class="grp"><span class="lbl">Measure</span>${Object.entries(MEASURES).map(([k,l])=>chip('measure',k,l)).join('')}</div>
    <div class="grp"><span class="lbl">Entry</span>${chip('entry','close','Signal close')}${chip('entry','open','Next open')}</div>
    <div class="grp"><span class="lbl">Brief</span>${chip('brief','all','All')}${briefs.slice(-10).reverse().map(b=>chip('brief',b,b)).join('')}</div>
    ${hs.length?`<div class="grp"><span class="lbl">Health call</span>${chip('health','all','All')}${hs.map(h=>chip('health',h,h)).join('')}</div>`:''}
    <div class="grp"><span class="lbl">Mechanics at</span>${S.horizons.map(h=>chip('h',h,h)).join('')}</div></div>
    ${F.measure==='x_univ'&&F.entry==='open'?'<div class="note warn">The all-theme-stocks baseline is measured close to close: pick Signal close for it.</div>':''}</section>`;
}
function overviewHTML(){
  const n=S.rows.filter(r=>!r.list.startsWith('pick_')&&!r.list.startsWith('all_')).length;
  const done=h=>S.rows.filter(r=>!r.list.startsWith('pick_')&&!r.list.startsWith('all_')&&r.res&&r.res[h]&&!r.res[h].pending&&r.status==='ok').length;
  return `<section id="overview"><h2>Overview</h2><div class="cards">
   <div class="card"><div class="nm">Briefs tracked</div><div class="big">${S.briefs.filter(b=>(b.edition||"morning")==="morning").length}</div><div class="row"><span>Midday editions</span><b>${S.briefs.filter(b=>(b.edition||"morning")!=="morning").length}</b></div><div class="row"><span>First · latest</span><b>${esc(S.briefs[0]?.session||'–')} · ${esc(S.briefs[S.briefs.length-1]?.session||'–')}</b></div></div>
   <div class="card"><div class="nm">Setups scored</div><div class="big">${n}</div>${S.horizons.map(h=>`<div class="row"><span>${h} results in</span><b>${done(h)} of ${n}</b></div>`).join('')}</div>
   <div class="card"><div class="nm">Prices</div><div class="big" style="font-size:16px">${esc(S.price_source)}</div><div class="row"><span>Scored</span><b>${esc(S.generated.replace('T',' '))}</b></div><div class="row"><span>All-stocks baseline</span><b>${S.universe_baseline?'yes':'no'}</b></div></div></div></section>`;
}
function render(){
  const open=document.getElementById('stats')?.open;
  document.getElementById('main').innerHTML=trackerHTML()+positionsHTML()+`<details id="stats" class="stats"${open?' open':''}><summary>Statistics across all briefs: hit rates, mechanics, health call, themes</summary>`
    +overviewHTML()+filtersHTML()+summaryHTML()+mechanicsHTML()+healthHTML()+themesHTML()+'</details>';
  document.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{F[c.dataset.f]=c.dataset.v;render()});
  document.querySelectorAll('[data-t]').forEach(c=>c.onclick=()=>{T[c.dataset.t]=c.dataset.v;render()});
  document.querySelectorAll('table.trk th[data-sort]').forEach(c=>c.onclick=()=>{T.sort=T.sort===c.dataset.sort?'rank':c.dataset.sort;render()});
  document.querySelectorAll('[data-ps]').forEach(c=>c.onclick=()=>{PS.view=c.dataset.ps;render()});
  const bs=document.getElementById('bsel');if(bs)bs.onchange=()=>{T.brief=bs.value;render()};
  const q=document.getElementById('q');q.oninput=()=>{T.q=q.value;const p=q.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
}
fetch('scorecard.json?'+Date.now()).then(r=>{if(!r.ok)throw new Error('scorecard.json not built yet: the tracker runs after each rebuild');return r.json()}).then(s=>{
  S=s;document.getElementById('stamp').textContent='Scored '+new Date(s.generated).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('nav').innerHTML=[['tracker','Setups'],['positions','Positions'],['stats','Statistics'],['brief.html','Brief']].map(([i,l])=>`<a href="${i.includes('.')?i:'#'+i}">${l}</a>`).join('');
  render();
}).catch(e=>{document.getElementById('stamp').textContent='';document.getElementById('main').innerHTML=`<section><h2>Scorecard not available</h2><p>${esc(e.message)}</p></section>`});
</script>
</body>
</html>
